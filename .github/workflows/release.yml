name: Release CloudAttach

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: plugin/package-lock.json

      - name: Synchronize release metadata
        run: node scripts/sync-release-metadata.mjs

      - name: Install dependencies
        run: npm ci --prefix plugin

      - name: Test and build
        run: |
          npm run test --prefix plugin
          npm run build --prefix plugin

      - name: Package and verify release assets
        run: |
          node scripts/package.mjs
          node scripts/verify-release.mjs "${GITHUB_REF_NAME}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/cloud-attach/main.js \
            dist/cloud-attach/manifest.json \
            dist/cloud-attach/styles.css \
            --title "CloudAttach ${GITHUB_REF_NAME}" \
            --generate-notes
